services:
  db:
    image: mysql:8.0
    container_name: mysql-inventory
    restart: always
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user_dev
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: